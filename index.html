<!-- NOVA PARTE PARA COLAR NO SEU CÓDIGO EXISTENTE -->

<div class="card">
<h3>Cadastro em Lote (colar do Excel)</h3>
<textarea id="lote" rows="6" style="width:100%" placeholder="Cole aqui: codigo,descricao,endereco_t1,endereco_t2"></textarea>
<button onclick="importarLote()">Importar Cadastro</button>
</div>

<script>
// substitui o cadastro fixo por dinâmico
let cadastro = JSON.parse(localStorage.getItem("cadastro")) || {};

function importarLote(){
  const texto = document.getElementById("lote").value;
  const linhas = texto.split("\n");

  linhas.forEach(l => {
    const [cod, desc, t1, t2] = l.split(",");
    if(cod){
      cadastro[cod.trim()] = {
        desc: desc ? desc.trim() : "",
        t1: t1 ? t1.trim() : "",
        t2: t2 ? t2.trim() : ""
      };
    }
  });

  localStorage.setItem("cadastro", JSON.stringify(cadastro));
  alert("Cadastro importado com sucesso!");
}

// ajustar função addItem para usar cadastro dinâmico
function addItem(){
 let cod = codEl().value;
 let desc = descEl().value;
 let consumo = Number(consEl().value);
 let saldo = Number(saldoEl().value);
 let cobertura = Number(document.getElementById("cobertura").value);

 if(cadastro[cod]){
   if(!desc) desc = cadastro[cod].desc;
 }

 let nec = (consumo * cobertura) - saldo;
 if(nec < 0) nec = 0;

 items.push({ cod, desc, consumo, saldo, nec });
 render(); limpar();
}

// export ajustado com endereço por torre
function exportar(){
 let torre = document.getElementById("torreEndereco").value;
 let csv = "Codigo,Descricao,Consumo,Saldo,Necessidade,Endereco\n";

 items.forEach(i=>{
 let end="";
 if(cadastro[i.cod]){
 end = torre=="1" ? cadastro[i.cod].t1 : cadastro[i.cod].t2;
 }

 csv += `${i.cod},${i.desc},${i.consumo},${i.saldo},${i.nec},${end}\n`;
 });

 let blob = new Blob([csv]);
 let a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = "ressuprimento.csv";
 a.click();
}
</script>

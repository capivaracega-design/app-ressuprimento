<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ressuprimento VNS</title>
<style>
body{font-family:Arial;background:#f4f1ec;margin:0}
.header{background:#b58b63;color:#fff;padding:20px}
.container{padding:20px}
.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:6px;border-left:5px solid #8a5a34}
input,textarea{margin:5px;padding:6px}
button{background:#8a5a34;color:#fff;border:none;padding:6px 12px;cursor:pointer;border-radius:4px;margin:2px}
.tab{display:inline-block;margin-right:5px;padding:8px 12px;background:#ddd;cursor:pointer;border-radius:4px}
.ativo{background:#8a5a34;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px}
th{background:#8a5a34;color:#fff}
textarea{width:100%;height:140px}
</style>
</head>
<body>

<div class="header">VILA NOVA STAR — Ressuprimento</div>

<div class="container">

<div>
<div class="tab ativo" onclick="abrir('operacao',this)">Operação</div>
<div class="tab" onclick="abrir('lote',this)">Importar Lote</div>
</div>

<!-- OPERAÇÃO -->
<div id="operacao">

<div class="card">
<input id="nomeUsuario" placeholder="Nome">
</div>

<div class="card">
Cobertura: <input type="number" id="cobertura" value="3">
</div>

<div class="card">
<input id="cod" placeholder="Código">
<input id="desc" placeholder="Descrição">
<input id="consumo" placeholder="Consumo">
<input id="saldo" placeholder="Saldo">
<button onclick="addItem()">Adicionar</button>
<button onclick="exportar()">Exportar Excel</button>
</div>

<div class="card">
<h3>Itens</h3>
<table>
<thead>
<tr><th>Código</th><th>Descrição</th><th>Necessidade</th><th></th></tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>

</div>

<!-- LOTE -->
<div id="lote" style="display:none">
<div class="card">
<h3>Colar itens (Código Descrição Saldo Qtd)</h3>
<textarea id="entrada"></textarea>
<button onclick="importarLote()">Carregar itens</button>
</div>
</div>

</div>

<script>
let items=[];

function abrir(id,el){
 document.getElementById('operacao').style.display='none';
 document.getElementById('lote').style.display='none';
 document.getElementById(id).style.display='block';
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
 el.classList.add('ativo');
}

function addItem(){
 const cod=document.getElementById('cod').value;
 const desc=document.getElementById('desc').value;
 const consumo=Number(document.getElementById('consumo').value)||0;
 const saldo=Number(document.getElementById('saldo').value)||0;
 const cobertura=Number(document.getElementById('cobertura').value)||0;

 if(!cod){alert('Digite código');return;}

 const nec=Math.max((consumo*cobertura)-saldo,0);
 items.push({cod,desc,nec});
 render();
 limpar();
}

function importarLote(){
 const texto=document.getElementById('entrada').value.split('\n');
 const cobertura=Number(document.getElementById('cobertura').value)||0;

 texto.forEach(l=>{
  let p=l.trim().split(/\s+/);
  if(p.length>=3){
   let cod=p[0];
   let qtd=Number(p[p.length-1]);
   let saldo=Number(p[p.length-2]);
   let desc=p.slice(1,p.length-2).join(' ');

   let nec=Math.max((qtd*cobertura)-saldo,0);
   items.push({cod,desc,nec});
  }
 });

 render();
 abrir('operacao',document.querySelector('.tab'));
}

function render(){
 let html='';
 items.forEach((i,idx)=>{
  html+=`<tr><td>${i.cod}</td><td>${i.desc}</td><td>${i.nec}</td><td><button onclick="remover(${idx})">X</button></td></tr>`;
 });
 lista.innerHTML=html;
}

function remover(i){items.splice(i,1);render();}

function limpar(){
 cod.value='';desc.value='';consumo.value='';saldo.value='';
}

function exportar(){
 let csv='Codigo,Descricao,Necessidade\n';
 items.forEach(i=>csv+=`${i.cod},${i.desc},${i.nec}\n`);
 let blob=new Blob([csv]);
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='ressuprimento.csv';
 a.click();
}
</script>

</body>
</html>

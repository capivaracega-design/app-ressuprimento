<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ressuprimento VNS</title>
<style>
body{font-family:Arial;background:#f4f1ec;margin:0}
.header{background:#b58b63;color:#fff;padding:20px}
.container{padding:20px}
.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:6px;border-left:5px solid #8a5a34}
input,textarea{margin:5px;padding:6px}
button{background:#8a5a34;color:#fff;border:none;padding:6px 12px;cursor:pointer;border-radius:4px;margin:2px}
.tab{display:inline-block;margin-right:5px;padding:8px 12px;background:#ddd;cursor:pointer;border-radius:4px}
.ativo{background:#8a5a34;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px}
th{background:#8a5a34;color:#fff}
textarea{width:100%;height:140px}
</style>
</head>
<body>

<div class="header">VILA NOVA STAR — Ressuprimento</div>

<div class="container">

<div>
<div class="tab ativo" onclick="abrir('operacao',this)">Operação</div>
<div class="tab" onclick="abrir('lote',this)">Importar Lote</div>
</div>

<!-- OPERAÇÃO -->
<div id="operacao">
<div class="card">
<input id="nomeUsuario" placeholder="Nome">
</div>

<div class="card">
Cobertura: <input type="number" id="cobertura" value="3">
</div>

<div class="card">
<button onclick="exportar()">Exportar Excel</button>
</div>

<div class="card">
<h3>Itens</h3>
<table>
<thead>
<tr><th>Código</th><th>Descrição</th><th>Saldo</th><th>Qtd</th><th>Necessidade</th><th></th></tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>
</div>

<!-- LOTE NOVO -->
<div id="lote" style="display:none">
<div class="card">
<h3>Adicionar item (por linha)</h3>
<input id="l_cod" placeholder="Código">
<input id="l_desc" placeholder="Descrição">
<input id="l_saldo" placeholder="Saldo Torre">
<input id="l_qtd" placeholder="Qtd CD">
<button onclick="addLoteItem()">Adicionar na lista</button>
</div>

<div class="card">
<h3>Itens adicionados</h3>
<table>
<thead>
<tr><th>Código</th><th>Descrição</th><th>Saldo</th><th>Qtd</th><th></th></tr>
</thead>
<tbody id="loteLista"></tbody>
</table>
<button onclick="confirmarLote()">Enviar para Operação</button>
</div>
</div>

</div>

<script>
let items=[];
let lote=[];

function abrir(id,el){
 document.getElementById('operacao').style.display='none';
 document.getElementById('lote').style.display='none';
 document.getElementById(id).style.display='block';
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
 el.classList.add('ativo');
}

// ✅ adicionar item no lote (um por vez)
function addLoteItem(){
 const cod=document.getElementById('l_cod').value;
 const desc=document.getElementById('l_desc').value;
 const saldo=Number(document.getElementById('l_saldo').value)||0;
 const qtd=Number(document.getElementById('l_qtd').value)||0;

 if(!cod){alert('Informe o código');return}

 lote.push({cod,desc,saldo,qtd});
 renderLote();

 // limpar
 l_cod.value='';l_desc.value='';l_saldo.value='';l_qtd.value='';
}

function renderLote(){
 let html='';
 lote.forEach((i,idx)=>{
  html+=`<tr>
    <td>${i.cod}</td>
    <td>${i.desc}</td>
    <td>${i.saldo}</td>
    <td>${i.qtd}</td>
    <td><button onclick="removerLote(${idx})">X</button></td>
  </tr>`;
 });
 document.getElementById('loteLista').innerHTML=html;
}

function removerLote(i){lote.splice(i,1);renderLote();}

// ✅ envia tudo para operação com cálculo
function confirmarLote(){
 const cobertura=Number(document.getElementById('cobertura').value)||0;

 lote.forEach(i=>{
  let nec=Math.max((i.qtd * cobertura) - i.saldo,0);
  items.push({...i,nec});
 });

 lote=[];
 renderLote();
 render();
 abrir('operacao',document.querySelector('.tab'));
}

// tabela principal
function render(){
 let html='';
 items.forEach((i,idx)=>{
  html+=`<tr>
   <td>${i.cod}</td>
   <td>${i.desc}</td>
   <td>${i.saldo}</td>
   <td>${i.qtd}</td>
   <td>${i.nec}</td>
   <td><button onclick="remover(${idx})">X</button></td>
  </tr>`;
 });
 lista.innerHTML=html;
}

function remover(i){items.splice(i,1);render();}

function exportar(){
 let csv='Codigo,Descricao,Saldo,Qtd,Necessidade\n';
 items.forEach(i=>csv+=`${i.cod},${i.desc},${i.saldo},${i.qtd},${i.nec}\n`);
 let blob=new Blob([csv]);
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='ressuprimento.csv';
 a.click();
}
</script>

</body>
</html>

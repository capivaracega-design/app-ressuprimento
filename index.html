<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ressuprimento - Vila Nova Star</title>
<style>
body { font-family: Arial; background:#f1f3f6; padding:20px; }
h1 { color:#0b3d91; }
.card { background:#fff; padding:15px; margin-bottom:10px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
.item { display:flex; justify-content:space-between; border-bottom:1px solid #ddd; padding:6px; }
button { background:#0b3d91; color:#fff; border:none; padding:6px 10px; cursor:pointer; }
</style>
</head>
<body>

<h1>Ressuprimento entre Torres - VNS</h1>

<div class="card">
Cobertura: <input type="number" id="cobertura" value="3">
Torre Endereço:
<select id="torreEndereco">
<option value="1">Torre 1</option>
<option value="2">Torre 2</option>
</select>
<button onclick="salvarPedido()">Salvar</button>
</div>

<div class="card">
<input id="cod" placeholder="Código">
<input id="desc" placeholder="Descrição (auto ou manual)">
<input id="consumo" placeholder="Consumo">
<input id="saldo" placeholder="Saldo">
<button onclick="addItem()">Adicionar</button>
</div>

<div class="card">
<h3>Itens</h3>
<div id="lista"></div>
</div>

<div class="card">
<h3>Histórico por Data</h3>
<input type="date" id="filtroData" onchange="carregarHistorico()">
<div id="historico"></div>
</div>

<script>
// Banco de itens automáticos
const cadastro = {
 "152157": { desc:"salina", t1:"A-01", t2:"B-01" },
 "348031": { desc:"equipo", t1:"A-02", t2:"B-02" }
};

let items = [];

function addItem(){
 let cod = codEl().value;
 let desc = descEl().value;
 let consumo = Number(consEl().value);
 let saldo = Number(saldoEl().value);
 let cobertura = Number(document.getElementById("cobertura").value);

 // preencher automático
 if(cadastro[cod]){
   if(!desc) desc = cadastro[cod].desc;
 }

 let nec = (consumo * cobertura) - saldo;
 if(nec < 0) nec = 0;

 items.push({ cod, desc, consumo, saldo, nec });
 render(); limpar();
}

function render(){
 let lista = document.getElementById("lista");
 lista.innerHTML = "";
 items.forEach((i,index)=>{
 let div = document.createElement("div");
 div.className="item";
 div.innerHTML = `${i.cod} - ${i.desc} | Nec: ${i.nec}
 <button onclick="remover(${index})">Excluir</button>`;
 lista.appendChild(div);
 });
}

function remover(i){ items.splice(i,1); render(); }

function salvarPedido(){
 let data = new Date().toISOString().split("T")[0];
 let historico = JSON.parse(localStorage.getItem("historico")) || {};
 historico[data] = items;
 localStorage.setItem("historico", JSON.stringify(historico));
 alert("Salvo com sucesso");
}

function carregarHistorico(){
 let data = document.getElementById("filtroData").value;
 let historico = JSON.parse(localStorage.getItem("historico")) || {};
 let div = document.getElementById("historico");
 div.innerHTML = "";
 if(historico[data]){
 historico[data].forEach(i=>{
 div.innerHTML += `${i.cod} - ${i.desc} | ${i.nec}<br>`;
 });
 }
}

function exportar(){
 let torre = document.getElementById("torreEndereco").value;
 let csv = "Codigo,Descricao,Consumo,Saldo,Necessidade,Endereco\n";
 items.forEach(i=>{
 let end="";
 if(cadastro[i.cod]){
 end = torre=="1" ? cadastro[i.cod].t1 : cadastro[i.cod].t2;
 }
 csv += `${i.cod},${i.desc},${i.consumo},${i.saldo},${i.nec},${end}\n`;
 });
 let blob = new Blob([csv]);
 let a = document.createElement("a");
 a.href = URL.createObjectURL(blob);
 a.download = "ressuprimento.csv";
 a.click();
}

function limpar(){ codEl().value=""; descEl().value=""; consEl().value=""; saldoEl().value=""; }
function codEl(){ return document.getElementById("cod"); }
function descEl(){ return document.getElementById("desc"); }
function consEl(){ return document.getElementById("consumo"); }
function saldoEl(){ return document.getElementById("saldo"); }
</script>

<button onclick="exportar()">Exportar Excel</button>

</body>
</html>

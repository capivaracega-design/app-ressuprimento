<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ressuprimento VNS</title>
<style>
body{font-family:Arial;background:#f4f1ec;margin:0}
.header{background:#b58b63;color:#fff;padding:20px}
.container{padding:20px}
.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:6px;border-left:5px solid #8a5a34}
input,textarea{margin:5px;padding:6px}
button{background:#8a5a34;color:#fff;border:none;padding:6px 12px;cursor:pointer;border-radius:4px;margin:2px}
.tab{display:inline-block;margin-right:5px;padding:8px 12px;background:#ddd;cursor:pointer;border-radius:4px}
.ativo{background:#8a5a34;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px}
th{background:#8a5a34;color:#fff}
textarea{width:100%;height:120px}
</style>
</head>
<body>

<div class="header">VILA NOVA STAR — Ressuprimento</div>

<div class="container">

<div>
<div class="tab ativo" onclick="abrir('operacao',this)">Operação</div>
<div class="tab" onclick="abrir('lote',this)">Importar Lote</div>
</div>

<div id="operacao">
<div class="card">
Cobertura: <input type="number" id="cobertura" value="3" onchange="recalcularTudo()">
<button onclick="exportar()">Exportar Excel</button>
</div>

<div class="card">
<h3>Itens</h3>
<table>
<thead>
<tr><th>Código</th><th>Descrição</th><th>Saldo</th><th>Qtd</th><th>Necessidade</th><th>Ações</th></tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>
</div>

<div id="lote" style="display:none">

<div class="card">
<h3>Adicionar item (manual)</h3>
<input id="l_cod" placeholder="Código">
<input id="l_desc" placeholder="Descrição">
<input id="l_saldo" placeholder="Saldo Torre">
<input id="l_qtd" placeholder="Qtd CD">
<button onclick="addLoteItem()">Adicionar</button>
</div>

<div class="card">
<h3>Colar Excel</h3>
<textarea id="excelInput"></textarea>
<button onclick="importarExcel()">Importar Excel</button>
</div>

<div class="card">
<h3>Itens adicionados</h3>
<table>
<thead>
<tr><th>Código</th><th>Descrição</th><th>Saldo</th><th>Qtd</th><th></th></tr>
</thead>
<tbody id="loteLista"></tbody>
</table>
<button onclick="confirmarLote()">Enviar para Operação</button>
</div>

</div>

</div>

<script>
let items=[];
let lote=[];

function abrir(id,el){
 document.getElementById('operacao').style.display='none';
 document.getElementById('lote').style.display='none';
 document.getElementById(id).style.display='block';
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
 el.classList.add('ativo');
}

function calcularNec(saldo,qtd){
 const cobertura=Number(document.getElementById('cobertura').value)||0;
 return Math.max((qtd*cobertura)-saldo,0);
}

// ✅ RECALCULAR AUTOMÁTICO
function recalcularTudo(){
 items.forEach(i=>{
  i.nec = calcularNec(i.saldo,i.qtd);
 });
 render();
}

// ✅ ADICIONAR MANUAL
function addLoteItem(){
 let cod=l_cod.value;
 let desc=l_desc.value;
 let saldo=Number(l_saldo.value)||0;
 let qtd=Number(l_qtd.value)||0;
 if(!cod)return;
 lote.push({cod,desc,saldo,qtd});
 renderLote();
 l_cod.value='';l_desc.value='';l_saldo.value='';l_qtd.value='';
}

// ✅ IMPORTAR EXCEL
function importarExcel(){
 let linhas=excelInput.value.split('\n');
 linhas.forEach(l=>{
  let col=l.split('\t');
  if(col.length>=4){
   let cod=col[0]?.trim();
   let desc=col[1]?.trim();
   let saldo=Number(col[2])||0;
   let qtd=Number(col[3])||0;
   if(cod) lote.push({cod,desc,saldo,qtd});
  }
 });
 renderLote();
 excelInput.value='';
}

function renderLote(){
 let html='';
 lote.forEach((i,idx)=>{
  html+=`<tr><td>${i.cod}</td><td>${i.desc}</td><td>${i.saldo}</td><td>${i.qtd}</td><td><button onclick="removerLote(${idx})">X</button></td></tr>`;
 });
 loteLista.innerHTML=html;
}

function removerLote(i){lote.splice(i,1);renderLote();}

// ✅ ENVIO PARA OPERAÇÃO
function confirmarLote(){
 lote.forEach(i=>{
  let nec=calcularNec(i.saldo,i.qtd);
  items.push({...i,nec});
 });
 lote=[];
 renderLote();
 render();
 abrir('operacao',document.querySelector('.tab'));
}

// ✅ EDITAR ITEM
function editar(idx){
 let i=items[idx];
 l_cod.value=i.cod;
 l_desc.value=i.desc;
 l_saldo.value=i.saldo;
 l_qtd.value=i.qtd;
 items.splice(idx,1);
 render();
 abrir('lote',document.querySelectorAll('.tab')[1]);
}

// ✅ TABELA
function render(){
 let html='';
 items.forEach((i,idx)=>{
  html+=`<tr>
   <td>${i.cod}</td>
   <td>${i.desc}</td>
   <td>${i.saldo}</td>
   <td>${i.qtd}</td>
   <td>${i.nec}</td>
   <td>
    <button onclick="editar(${idx})">Editar</button>
    <button onclick="remover(${idx})">X</button>
   </td>
  </tr>`;
 });
 lista.innerHTML=html;
}

function remover(i){items.splice(i,1);render();}

function exportar(){
 let csv='Codigo,Descricao,Saldo,Qtd,Necessidade\n';
 items.forEach(i=>csv+=`${i.cod},${i.desc},${i.saldo},${i.qtd},${i.nec}\n`);
 let blob=new Blob([csv]);
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='ressuprimento.csv';
 a.click();
}
</script>

</body>
</html>

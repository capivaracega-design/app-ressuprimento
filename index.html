<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ressuprimento VNS</title>
<style>
body{font-family:Arial;background:#f4f1ec;margin:0}
.header{background:#b58b63;color:#fff;padding:20px}
.container{padding:20px}
.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:6px;border-left:5px solid #8a5a34}
input,select,textarea{margin:5px;padding:6px}
button{background:#8a5a34;color:#fff;border:none;padding:6px 12px;cursor:pointer;border-radius:4px}
.tab{display:inline-block;margin-right:5px;padding:8px 12px;background:#ddd;cursor:pointer;border-radius:4px}
.ativo{background:#8a5a34;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px;text-align:left}
th{background:#8a5a34;color:#fff}
</style>
</head>
<body>

<div class="header">VILA NOVA STAR — Ressuprimento</div>

<div class="container">

<div>
<div class="tab ativo" onclick="abrir('operacao',this)">Operação</div>
<div class="tab" onclick="abrir('cadastro',this)">Cadastro Endereços</div>
</div>

<div id="operacao">

<div class="card">
<label>Nome do responsável:</label><br>
<input id="nomeUsuario" placeholder="Digite seu nome">
</div>

<div class="card">
Cobertura: <input type="number" id="cobertura" value="3">
<select id="torre"><option>Torre 1</option><option>Torre 2</option></select>
Data: <input type="date" id="dataPedido">
<button onclick="salvarPedido()">Salvar Pedido</button>
</div>

<div class="card">
<input id="cod" placeholder="Código" onblur="autoDesc()">
<input id="desc" placeholder="Descrição">
<input id="consumo" placeholder="Consumo">
<input id="saldo" placeholder="Saldo">
<button onclick="addItem()">Adicionar</button>
</div>

<div class="card">
<h3>Itens</h3>
<table>
<thead>
<tr><th>Código</th><th>Descrição</th><th>Necessidade</th><th>Ação</th></tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>

<div class="card">
<h3>Histórico</h3>
<input type="date" id="buscarData" onchange="carregarHistorico()">
<div id="historico"></div>
</div>

<button onclick="exportar()">Exportar Excel</button>

</div>

<div id="cadastro" style="display:none">
<div class="card">
<h3>Cadastro em lote (Código,Descrição,T1,T2)</h3>
<textarea id="loteCadastro"></textarea>
<button onclick="importarCadastro()">Salvar Cadastro</button>
</div>
</div>

</div>

<!-- ✅ FIREBASE CORRIGIDO -->
https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({apiKey:"AIzaSyAzoads1OH6SEKU5UxlAUYgBPEmO_hy2w4",projectId:"ressuprimento-vns"});
const db=firebase.firestore();

let items=[];
let cadastro={};

function abrir(id,el){
 document.getElementById('operacao').style.display='none';
 document.getElementById('cadastro').style.display='none';
 document.getElementById(id).style.display='block';
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
 el.classList.add('ativo');
}

function importarCadastro(){
 document.getElementById('loteCadastro').value.split('\n').forEach(l=>{
  let [cod,desc]=l.split(/[\t,]/);
  if(cod){db.collection('cadastro').doc(cod.trim()).set({desc});}
 });
 alert('Cadastro salvo');
}

function carregarCadastro(){
 db.collection('cadastro').onSnapshot(s=>{
  cadastro={};
  s.forEach(d=>cadastro[d.id]=d.data());
 });
}
carregarCadastro();

function autoDesc(){
 let c=document.getElementById('cod').value;
 if(cadastro[c]) document.getElementById('desc').value=cadastro[c].desc;
}

// ✅ CORREÇÃO DO ERRO DE ADICIONAR
function addItem(){
 let cod=document.getElementById('cod').value;
 let desc=document.getElementById('desc').value || cadastro[cod]?.desc || '';
 let consumo=Number(document.getElementById('consumo').value);
 let saldo=Number(document.getElementById('saldo').value);

 if(!cod){alert('Informe o código');return}

 let nec=(consumo*Number(document.getElementById('cobertura').value))-saldo;
 if(nec<0) nec=0;

 items.push({cod,desc,nec});
 render();

 // limpa campos
 document.getElementById('cod').value='';
 document.getElementById('desc').value='';
 document.getElementById('consumo').value='';
 document.getElementById('saldo').value='';
}

function render(){
 let html='';
 items.forEach((i,idx)=>{
  html+=`<tr><td>${i.cod}</td><td>${i.desc}</td><td>${i.nec}</td><td><button onclick="remover(${idx})">X</button></td></tr>`;
 });
 document.getElementById('lista').innerHTML=html;
}

function remover(i){items.splice(i,1);render()}

function salvarPedido(){
 if(!document.getElementById('nomeUsuario').value || !document.getElementById('dataPedido').value){
  alert('Preencher nome e data');return;
 }

 items.forEach(i=>db.collection('pedidos').add({
  data:dataPedido.value,
  usuario:nomeUsuario.value,
  ...i
 }));

 alert('Salvo ✅');
 items=[];render();
}

function carregarHistorico(){
 db.collection('pedidos').where('data','==',buscarData.value)
 .onSnapshot(s=>{
  let html='';
  s.forEach(d=>{
   let i=d.data();
   html+=`${i.cod} - ${i.desc} | ${i.nec} | ${i.usuario}<br>`;
  });
  document.getElementById('historico').innerHTML=html;
 });
}

function exportar(){
 let csv='Codigo,Descricao,Necessidade\n';
 items.forEach(i=>csv+=`${i.cod},${i.desc},${i.nec}\n`);
 let blob=new Blob([csv]);
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='ressuprimento.csv';
 a.click();
}
</script>

</body>
</html>

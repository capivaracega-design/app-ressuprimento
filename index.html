<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ressuprimento VNS</title>
<style>
body{font-family:Arial;background:#f4f1ec;margin:0}
.header{background:#b58b63;color:#fff;padding:20px;display:flex;gap:20px}
.logo{font-weight:bold;font-size:22px}
.container{padding:20px}
.tab{display:inline-block;padding:10px 15px;margin-right:5px;background:#ddd;cursor:pointer;border-radius:5px}
.ativo{background:#8a5a34;color:#fff}
.card{background:#fff;padding:15px;margin-top:10px;border-left:5px solid #8a5a34;border-radius:6px}
textarea{width:100%;height:120px;margin:5px;padding:6px}
button{background:#8a5a34;color:#fff;border:none;padding:6px 14px;cursor:pointer;border-radius:4px}
</style>
</head>
<body>

<div class="header">
 <div class="logo">VILA NOVA STAR</div>
 <div>Ressuprimento</div>
</div>

<div class="container">

<div>
 <div class="tab ativo" onclick="abrir('operacao',this)">Operação</div>
 <div class="tab" onclick="abrir('cadastro',this)">Cadastro</div>
 <div class="tab" onclick="abrir('importacao',this)">Importar CD</div>
</div>

<div id="operacao">
<div class="card">
Nome: <input id="nomeUsuario">
Cobertura: <input type="number" id="cobertura" value="3">
Data: <input type="date" id="dataPedido">
<button onclick="salvarPedido()">Salvar</button>
</div>
<div class="card"><h3>Itens</h3><div id="lista"></div></div>
</div>

<div id="cadastro" style="display:none">
<div class="card">
<textarea id="loteCadastro"></textarea>
<button onclick="importarCadastro()">Salvar Cadastro</button>
</div>
</div>

<div id="importacao" style="display:none">
<div class="card">
<textarea id="lotePedido"></textarea>
<button onclick="importarPedido()">Carregar</button>
</div>
</div>

</div>

https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({apiKey:"AIzaSyAzoads1OH6SEKU5UxlAUYgBPEmO_hy2w4",projectId:"ressuprimento-vns"});
const db=firebase.firestore();

let items=[];let cadastro={};

function abrir(id,el){['operacao','cadastro','importacao'].forEach(i=>document.getElementById(i).style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));el.classList.add('ativo')}

function carregarCadastro(){db.collection('cadastro').onSnapshot(s=>{cadastro={};s.forEach(d=>cadastro[d.id]=d.data())})}
carregarCadastro();

function importarCadastro(){
 loteCadastro.value.split('\n').forEach(l=>{
 let [cod,desc,t1,t2]=l.split(/[\t,]/);
 if(cod){db.collection('cadastro').doc(cod.trim()).set({desc,t1,t2});}
 });alert('ok');
}

// ✅ CORREÇÃO AQUI
function importarPedido(){
 items=[];
 lotePedido.value.split('\n').forEach(l=>{
 let partes=l.trim().split(/\s+/);
 if(partes.length>=2){
 let cod=partes[0];
 let quantidade=Number(partes[partes.length-1]);
 let desc=partes.slice(1,partes.length-1).join(' ');
 let saldo=0;
 let nec=(quantidade*Number(cobertura.value))-saldo;
 if(nec<0) nec=0;
 items.push({cod,desc,cons:quantidade,saldo,nec});
 }
 });
 render();
}

function render(){
 lista.innerHTML=items.map((i,idx)=>`${i.cod} - ${i.desc} | ${i.nec} <button onclick="remover(${idx})">X</button>`).join('<br>');
}

function remover(i){items.splice(i,1);render()}

function salvarPedido(){
 items.forEach(i=>db.collection('pedidos').add({data:dataPedido.value,usuario:nomeUsuario.value,...i}));
 alert('salvo');items=[];render();
}
</script>

</body>
</html>

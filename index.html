<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ressuprimento VNS</title>
<style>
body{font-family:Arial;background:#f1f3f6;padding:20px}
h1{color:#0b3d91}
.tab{display:inline-block;padding:10px 15px;background:#ddd;margin-right:5px;cursor:pointer;border-radius:5px}
.ativo{background:#0b3d91;color:#fff}
.card{background:#fff;padding:15px;margin-top:10px;border-radius:8px}
</style>
</head>
<body>

<h1>Ressuprimento VNS</h1>

<div class="card" id="loginBox">
<h3>Login</h3>
<input id="email" placeholder="Email">
<input id="senha" type="password" placeholder="Senha">
<br>
<button onclick="login()">Entrar</button>
<button onclick="registrar()">Cadastrar</button>
</div>

<div id="app" style="display:none">
<p>Usuário: <span id="userEmail"></span> <button onclick="logout()">Sair</button></p>

<div>
  <div class="tab ativo" onclick="abrir('operacao',this)">Operação</div>
  <div class="tab" onclick="abrir('cadastro',this)">Cadastro</div>
</div>

<div id="operacao">
<div class="card">
Cobertura: <input type="number" id="cobertura" value="3">
<select id="torreEndereco">
<option value="1">T1</option>
<option value="2">T2</option>
</select>
Data: <input type="date" id="dataPedido">
<button onclick="salvarPedido()">Salvar</button>
</div>

<div class="card">
<input id="cod" placeholder="Código">
<input id="desc" placeholder="Descrição">
<input id="consumo" placeholder="Consumo">
<input id="saldo" placeholder="Saldo">
<button onclick="addItem()">Adicionar</button>
</div>

<div class="card">
<h3>Itens</h3>
<div id="lista"></div>
</div>

<div class="card">
<h3>Histórico</h3>
<input type="date" id="buscarData" onchange="carregarHistorico()">
<div id="historico"></div>
</div>

<button onclick="exportar()">Exportar Excel</button>
</div>

<div id="cadastro" style="display:none">
<div class="card">
<textarea id="lote" style="width:100%;height:150px"></textarea><br>
<button onclick="importar()">Importar Cadastro</button>
</div>
</div>
</div>

<!-- ✅ FIREBASE CORRETO -->
https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzoads1OH6SEKU5UxlAUYgBPEmO_hy2w4",
  authDomain: "ressuprimento-vns.firebaseapp.com",
  projectId: "ressuprimento-vns",
  storageBucket: "ressuprimento-vns.firebasestorage.app",
  messagingSenderId: "562110480825",
  appId: "1:562110480825:web:02a5afaaa130b5dbacf668"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let items = [];
let cadastro = {};

function registrar(){
 auth.createUserWithEmailAndPassword(email.value, senha.value)
 .then(()=>alert('Usuário criado'))
 .catch(e=>alert(e.message));
}

function login(){
 auth.signInWithEmailAndPassword(email.value, senha.value);
}

function logout(){ auth.signOut(); }

auth.onAuthStateChanged(user=>{
 if(user){
 loginBox.style.display='none';
 app.style.display='block';
 userEmail.innerText=user.email;
 carregarCadastro();
 } else {
 loginBox.style.display='block';
 app.style.display='none';
 }
});

function abrir(id,el){
 operacao.style.display='none';
 cadastro.style.display='none';
 document.getElementById(id).style.display='block';
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
 el.classList.add('ativo');
}

function importar(){
 lote.value.split('\n').forEach(l=>{
 let [cod,desc,t1,t2]=l.split(/[,\t]/);
 if(cod){
 db.collection('cadastro').doc(cod.trim()).set({desc,t1,t2});
 }
 });
 alert('Cadastro salvo na nuvem');
}

function carregarCadastro(){
 db.collection('cadastro').onSnapshot(s=>{
 cadastro={};
 s.forEach(doc=>cadastro[doc.id]=doc.data());
 });
}

function addItem(){
 let cod=codEl().value;
 let desc=descEl().value || cadastro[cod]?.desc || '';
 let cons=Number(consEl().value);
 let saldo=Number(saldoEl().value);
 let nec=(cons*cobertura.value)-saldo; if(nec<0) nec=0;
 items.push({cod,desc,cons,saldo,nec});
 render();
}

function render(){
 lista.innerHTML='';
 items.forEach((i,index)=>{
 lista.innerHTML+=`${i.cod} - ${i.desc} | ${i.nec} <button onclick="remover(${index})">X</button><br>`;
 });
}

function remover(i){ items.splice(i,1); render(); }

function salvarPedido(){
 let data=dataPedido.value;
 if(!data){alert('Selecione a data');return;}
 items.forEach(i=> db.collection('pedidos').add({data,usuario:userEmail.innerText,...i}));
 alert('Salvo online ✅');
}

function carregarHistorico(){
 let data=buscarData.value;
 db.collection('pedidos').where('data','==',data)
 .onSnapshot(s=>{
 historico.innerHTML='';
 s.forEach(doc=>{
 let i=doc.data();
 historico.innerHTML+=`${i.cod} - ${i.desc} | ${i.nec} | ${i.usuario}<br>`;
 });
 });
}

function exportar(){
 let torre=torreEndereco.value;
 let csv='Codigo,Descricao,Necessidade,Endereco\n';
 items.forEach(i=>{
 let end=cadastro[i.cod]? (torre=='1'?cadastro[i.cod].t1:cadastro[i.cod].t2):'';
 csv+=`${i.cod},${i.desc},${i.nec},${end}\n`;
 });
 let blob=new Blob([csv]);
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='ressuprimento.csv';
 a.click();
}

function codEl(){return document.getElementById('cod');}
function descEl(){return document.getElementById('desc');}
function consEl(){return document.getElementById('consumo');}
function saldoEl(){return document.getElementById('saldo');}
</script>

</body>
</html>

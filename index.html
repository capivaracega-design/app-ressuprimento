<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ressuprimento VNS</title>
<style>
body{font-family:Arial;background:#f4f1ec;margin:0}
.header{background:#b58b63;color:#fff;padding:20px;display:flex;gap:20px}
.logo{font-weight:bold;font-size:22px}
.container{padding:20px}
.tab{display:inline-block;padding:10px 15px;margin-right:5px;background:#ddd;cursor:pointer;border-radius:5px}
.ativo{background:#8a5a34;color:#fff}
.card{background:#fff;padding:15px;margin-top:10px;border-left:5px solid #8a5a34;border-radius:6px}
textarea,input{margin:5px;padding:6px;width:100%}
button{background:#8a5a34;color:#fff;border:none;padding:6px 14px;cursor:pointer;border-radius:4px}
h3{color:#8a5a34}
</style>
</head>
<body>

<div class="header">
<div class="logo">VILA NOVA STAR</div>
<div>Ressuprimento</div>
</div>

<div class="container">

<div>
<div class="tab ativo" onclick="abrir('operacao',this)">Operação</div>
<div class="tab" onclick="abrir('cadastro',this)">Cadastro</div>
<div class="tab" onclick="abrir('importacao',this)">Importar CD</div>
</div>

<!-- OPERAÇÃO -->
<div id="operacao">
<div class="card">
Nome: <input id="nomeUsuario">
Cobertura: <input id="cobertura" type="number" value="3">
Data: <input id="dataPedido" type="date">
<button onclick="salvarPedido()">Salvar</button>
</div>

<div class="card">
<h3>Itens</h3>
<div id="lista"></div>
</div>

<div class="card">
<h3>Histórico</h3>
<input type="date" id="buscarData" onchange="carregarHistorico()">
<div id="historico"></div>
</div>

<button onclick="exportar()">Exportar Excel</button>

</div>

<!-- CADASTRO -->
<div id="cadastro" style="display:none">
<div class="card">
<h3>Cadastro lote</h3>
<textarea id="loteCadastro"></textarea>
<button onclick="importarCadastro()">Salvar</button>
</div>
</div>

<!-- IMPORTAÇÃO -->
<div id="importacao" style="display:none">
<div class="card">
<h3>Colar pedido CD</h3>
<textarea id="lotePedido"></textarea>
<button onclick="importarPedido()">Carregar</button>
</div>
</div>

</div>

<!-- ✅ CORRETO -->
https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({apiKey:"AIzaSyAzoads1OH6SEKU5UxlAUYgBPEmO_hy2w4",projectId:"ressuprimento-vns"});
const db=firebase.firestore();

let items=[];
let cadastro={};

function abrir(id,el){['operacao','cadastro','importacao'].forEach(i=>document.getElementById(i).style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));el.classList.add('ativo')}

// CADASTRO
function importarCadastro(){
 loteCadastro.value.split('\n').forEach(l=>{
 let [cod,desc]=l.split(/[\t,]/);
 if(cod){db.collection('cadastro').doc(cod.trim()).set({desc});}
 });
 alert('Cadastro salvo');
}

function carregarCadastro(){
 db.collection('cadastro').onSnapshot(s=>{
 cadastro={};
 s.forEach(d=>cadastro[d.id]=d.data());
 });
}
carregarCadastro();

// ✅ IMPORTAÇÃO REAL CD
function importarPedido(){
 items=[];
 lotePedido.value.split('\n').forEach(l=>{
 let partes=l.trim().split(/\s+/);
 if(partes.length>=2){
 let cod=partes[0];
 let qtd=Number(partes[partes.length-1]);
 let desc=partes.slice(1,partes.length-1).join(' ');
 let nec=(qtd*Number(cobertura.value));
 items.push({cod,desc,cons:qtd,saldo:0,nec});
 }
 });
 render();
 abrir('operacao',document.querySelector('.tab'));
}

function render(){
 lista.innerHTML=items.map((i,idx)=>`${i.cod} - ${i.desc} | Nec: ${i.nec} <button onclick="remover(${idx})">X</button>`).join('<br>');
}

function remover(i){items.splice(i,1);render()}

// SALVAR
function salvarPedido(){
 if(!dataPedido.value||!nomeUsuario.value){alert('Preencher nome e data');return}
 items.forEach(i=>db.collection('pedidos').add({data:dataPedido.value,usuario:nomeUsuario.value,...i}));
 alert('Salvo ✅');
}

// HISTÓRICO
function carregarHistorico(){
 db.collection('pedidos').where('data','==',buscarData.value)
 .onSnapshot(s=>{
 historico.innerHTML='';
 s.forEach(d=>{
 let i=d.data();
 historico.innerHTML+=`${i.cod} - ${i.desc} | ${i.nec} | ${i.usuario}<br>`;
 });
 });
}

// EXPORTAR
function exportar(){
 let csv='Codigo,Descricao,Necessidade\n';
 items.forEach(i=>{
 csv+=`${i.cod},${i.desc},${i.nec}\n`;
 });
 let blob=new Blob([csv]);
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='ressuprimento.csv';
 a.click();
}
</script>

</body>
</html>

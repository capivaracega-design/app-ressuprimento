<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ressuprimento VNS</title>
<style>
body{
 font-family:Arial;
 background:#f4f1ec;
 margin:0;
}
.header{
 background:#b58b63;
 color:white;
 padding:20px;
 display:flex;
 align-items:center;
 gap:20px;
}
.logo{
 font-weight:bold;
 font-size:22px;
}
.subtitle{
 font-size:18px;
}
.container{
 padding:20px;
}
.card{
 background:white;
 padding:15px;
 margin-bottom:10px;
 border-radius:6px;
 border-left:5px solid #8a5a34;
}
input,select{
 margin:5px;
 padding:6px;
 border:1px solid #ccc;
 border-radius:4px;
}
button{
 background:#8a5a34;
 color:white;
 border:none;
 padding:6px 14px;
 cursor:pointer;
 border-radius:4px;
}
button:hover{background:#6f4728}
h3{color:#8a5a34}
</style>
</head>
<body>

<div class="header">
 <div class="logo">VILA NOVA STAR</div>
 <div class="subtitle">Ressuprimento</div>
</div>

<div class="container">

<div class="card">
<label><b>Nome do responsável:</b></label><br>
<input id="nomeUsuario" placeholder="Digite seu nome">
</div>

<div class="card">
Cobertura: <input type="number" id="cobertura" value="3">
<select id="torreEndereco">
<option value="1">Torre 1</option>
<option value="2">Torre 2</option>
</select>
Data: <input type="date" id="dataPedido">
<button onclick="salvarPedido()">Salvar Pedido</button>
</div>

<div class="card">
<input id="cod" placeholder="Código">
<input id="desc" placeholder="Descrição">
<input id="consumo" placeholder="Consumo">
<input id="saldo" placeholder="Saldo">
<button onclick="addItem()">Adicionar</button>
</div>

<div class="card">
<h3>Itens</h3>
<div id="lista"></div>
</div>

<div class="card">
<h3>Histórico</h3>
<input type="date" id="buscarData" onchange="carregarHistorico()">
<div id="historico"></div>
</div>

<button onclick="exportar()">Exportar Excel</button>

</div>

<!-- ✅ FIREBASE CORRIGIDO -->
https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzoads1OH6SEKU5UxlAUYgBPEmO_hy2w4",
  authDomain: "ressuprimento-vns.firebaseapp.com",
  projectId: "ressuprimento-vns",
  storageBucket: "ressuprimento-vns.firebasestorage.app",
  messagingSenderId: "562110480825",
  appId: "1:562110480825:web:02a5afaaa130b5dbacf668"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let items = [];
let cadastro = {};

function carregarCadastro(){
 db.collection('cadastro').onSnapshot(s=>{
 cadastro={};
 s.forEach(doc=>cadastro[doc.id]=doc.data());
 });
}
carregarCadastro();

function addItem(){
 let cod=codEl().value;
 let desc=descEl().value || cadastro[cod]?.desc || '';
 let cons=Number(consEl().value);
 let saldo=Number(saldoEl().value);
 let nec=(cons*cobertura.value)-saldo; if(nec<0) nec=0;
 items.push({cod,desc,cons,saldo,nec});
 render();
}

function render(){
 lista.innerHTML='';
 items.forEach((i,index)=>{
 lista.innerHTML+=`${i.cod} - ${i.desc} | ${i.nec} <button onclick="remover(${index})">X</button><br>`;
 });
}

function remover(i){ items.splice(i,1); render(); }

function salvarPedido(){
 let data=dataPedido.value;
 let usuario=document.getElementById('nomeUsuario').value;

 if(!data){alert('Selecione a data');return;}
 if(!usuario){alert('Informe seu nome');return;}

 items.forEach(i=> db.collection('pedidos').add({data,usuario,...i}));
 alert('Salvo online ✅');
 items=[]; render();
}

function carregarHistorico(){
 let data=buscarData.value;
 db.collection('pedidos').where('data','==',data)
 .onSnapshot(s=>{
 historico.innerHTML='';
 s.forEach(doc=>{
 let i=doc.data();
 historico.innerHTML+=`${i.cod} - ${i.desc} | ${i.nec} | ${i.usuario}<br>`;
 });
 });
}

function exportar(){
 let torre=torreEndereco.value;
 let csv='Codigo,Descricao,Necessidade,Endereco\n';
 items.forEach(i=>{
 let end=cadastro[i.cod]? (torre=='1'?cadastro[i.cod].t1:cadastro[i.cod].t2):'';
 csv+=`${i.cod},${i.desc},${i.nec},${end}\n`;
 });
 let blob=new Blob([csv]);
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='ressuprimento.csv';
 a.click();
}

function codEl(){return document.getElementById('cod');}
function descEl(){return document.getElementById('desc');}
function consEl(){return document.getElementById('consumo');}
function saldoEl(){return document.getElementById('saldo');}
</script>

</body>
</html>
